<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - Leadership Helper</title>
    <style>
        :root {
            color-scheme: light;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(145deg, #f4fff8, #e8f7ee);
            color: #0f5132;
            padding: 24px;
        }

        main {
            width: min(560px, 100%);
            background: #ffffff;
            border: 1px solid #cde9db;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(16, 86, 55, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 1.6rem;
        }

        p {
            line-height: 1.5;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        a {
            text-decoration: none;
            border: 1px solid #0f5132;
            border-radius: 8px;
            padding: 10px 14px;
            color: #0f5132;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main>
        <h1>You are offline</h1>
        <p>
            Pages you have already visited are still available while offline.
        </p>
        <div class="actions">
            <a href="/">Home</a>
            <a href="/situations">Browse situations</a>
        </div>
    </main>
</body>
</html>
